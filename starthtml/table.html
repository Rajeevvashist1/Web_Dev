<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
    <style>
        
        table{
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }
        td , th{
            background-color: rgb(30, 29, 29);
            color: #fff;
        }
    </style>
</head>
<body>
    <table>

        </tr>

        </tr>

        </tr>
        <tr>
            <td>dheeraj</td>

        </tr>
        <tr>
            <td>tanish</td>

        </tr>
        <tr>

    </table>
    
</body>
</html>
